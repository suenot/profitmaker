<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profitmaker</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />
    <meta property="og:image" content="/og-image.png" />
    <!--
      Partial CSP. Only the directives that hold in every deployment live here;
      the rest must be sent as a header by whatever serves this bundle.

      `script-src`/`connect-src` are deliberately absent: the terminal talks to a
      user-configured ccxt-server (ConnectionScreen), its socket on port+1, and
      `import()`s module bundles from `<serverUrl>/modules/<id>/bundle.js` — none
      of which are same-origin in dev or in a self-hosted setup, so a static
      allowlist here would break the app rather than protect it.
    -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <!-- Applies the appearance before the first paint so the page does not
         flash. A short copy of applyAppearance in src/lib/themes.ts: keep the
         two in sync. The custom accent colour is applied there, not here. -->
    <script>
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('appearance') || '{}');
          var light = { 'marketmaker-light': 1, light: 1, paper: 1 };
          var legacy = localStorage.getItem('themeId') || localStorage.getItem('theme');
          var mode = a.mode || (legacy ? (light[legacy] ? 'light' : 'dark') : 'system');
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var id = mode === 'dark' ? a.darkTheme : a.lightTheme;
          if (!id && legacy && legacy !== 'dark' && legacy !== 'light' && !!light[legacy] === (mode === 'light')) id = legacy;
          if (!id || !!light[id] !== (mode === 'light')) id = mode === 'dark' ? 'marketmaker' : 'marketmaker-light';
          var root = document.documentElement;
          var d = root.dataset;
          d.theme = id;
          root.classList.add(mode);
          root.style.colorScheme = mode;
          if (a.accent && a.accent !== 'palette' && a.accent !== 'custom') d.accent = a.accent;
          if (a.priceColors && a.priceColors !== 'classic') d.price = a.priceColors;
          if (a.radius && a.radius !== 'palette') d.radius = a.radius;
          if (a.font && a.font !== 'geist') d.font = a.font;
          if (a.scale && a.scale !== 'default') d.scale = a.scale;
          if (a.grain !== false) d.grain = 'on';
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
